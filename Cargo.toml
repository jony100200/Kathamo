[workspace]
resolver = "2"
members = [
    "core",
    "platform",
    "render",
    "themes",
    "text",
    "widgets",
    "testkit",
    "lab",
]
default-members = ["lab"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Kalponic Studio"]
license = "MIT"
repository = "https://github.com/jony100200/Kathamo"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
