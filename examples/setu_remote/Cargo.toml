[package]
name = "kathamo-setu-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Phone controller for a Kathamo host app (Setu, Kolpona) over MCP"

[lib]
# cdylib = the .so the APK loads; rlib lets the desktop binary and tests reuse it.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kathamo-setu-remote"
path = "src/main.rs"

[dependencies]
kathamo = { path = "../../sdk", features = ["remote"] }
